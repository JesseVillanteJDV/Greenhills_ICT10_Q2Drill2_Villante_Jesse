<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <title>Member Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #eff6ff, #e0e7ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: white;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(30, 64, 175, 0.15);
        }

        .icon {
            width: 65px;
            height: 65px;
            background-color: #dbeafe;
            color: #2563eb;
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            margin: 0 auto 20px;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            font-size: 28px;
            margin: 0 0 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #334155;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px #dbeafe;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.25);
        }

        #output {
            margin-top: 25px;
            color: #334155;
            font-size: 14px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="icon">👥</div>

        <h1>Member Registration</h1>

        <p class="subtitle">
            Welcome! Enter your details below to add a new member.
        </p>

        <label for="first_name">First Name</label>
        <input
            type="text"
            id="first_name"
            placeholder="Enter your first name"
        >

        <label for="last_name">Last Name</label>
        <input
            type="text"
            id="last_name"
            placeholder="Enter your last name"
        >

        <button py-click="add_member">+ Add Member</button>

        <div id="output"></div>

        <div class="footer">
            Member Registration System
        </div>

    </div>

    <py-script src="main.py"></py-script>
</body>
</html>
